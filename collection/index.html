      <script>
        const sheet = document.querySelector(".bottom-sheet");
        const overlay = document.querySelector(".sheet-overlay");
        const sheetContent = document.querySelector(".sheet-content");
        const sheetTitle = document.getElementById("sheet-title");

        function openSheet(title, content) {
          sheetTitle.innerHTML = title;
          sheetContent.innerHTML = content;

          sheet.classList.add("show");
          overlay.classList.add("show");
        }

        function closeSheet() {
          sheet.classList.remove("show");
          overlay.classList.remove("show");
        }

        document.getElementById("sheet-close").onclick = closeSheet;
        overlay.onclick = closeSheet;

        document.getElementById("gender-btn").onclick = () => {
          openSheet(
            "Gender",
            `
      <label><input type="radio" name="gender" value="all" ${activeGender === "all" ? "checked" : ""}> All</label><br><br>
      <label><input type="radio" name="gender" value="female" ${activeGender === "female" ? "checked" : ""}> Female</label><br><br>
      <label><input type="radio" name="gender" value="male" ${activeGender === "male" ? "checked" : ""}> Male</label>
    `,
          );

          document.querySelectorAll('input[name="gender"]').forEach((radio) => {
            radio.addEventListener("change", (e) => {
              activeGender = e.target.value;
              renderCollections(); // your existing function
              closeSheet();
            });
          });
        };

        document.getElementById("sort-btn").onclick = () => {
          openSheet("Sort", "<p>Coming Soon...</p>");
        };

        document.getElementById("filter-btn").onclick = () => {
          openSheet("Filter", "<p>Coming Soon...</p>");
        };
      </script>

    <!-- if you want to shuffle contents -->

    <script>
      const collectionGrid = document.getElementById("collection-grid");

      let collections = [];

      let activeCategory = "all";
      let activeGender = "all";

      function shuffleArray(array) {
        return [...array].sort(() => Math.random() - 0.5);
      }

      async function loadCollections() {
        try {
          const response = await fetch(
            "../assets/datas/collection/collection.json",
          );

          collections = await response.json();

          // Shuffle once on page load
          collections = shuffleArray(collections);

          renderCollections();
        } catch (error) {
          console.error(error);
        }
      }

      function renderCollections() {
        let filtered = collections;

        // CATEGORY FILTER
        if (activeCategory !== "all") {
          filtered = filtered.filter(
            (item) => item.category === activeCategory,
          );
        }

        // GENDER FILTER
        if (activeGender !== "all") {
          filtered = filtered.filter((item) => item.gender === activeGender);
        }

        collectionGrid.innerHTML = filtered
          .map(
            (item) => `
        <article class="collection-item">
          <div class="collection-media">
            <img 
              src="${item.photo}" 
              loading="eager"
              fetchpriority="high"
              alt="${item.title}"
            >
          </div>

          <div class="collection-info">
            <span class="collection-tag">${item.category}</span>

            <h5>${item.title}</h5>

            <p class="collection-price">
              ${item.price !== "" ? "Rs. " + item.price : ""}
            </p>

            <a
              class="whatsapp-link"
              href="https://wa.me/9749693181?text=${encodeURIComponent(
                `Hi Siblings Creations, I am interested in ${item.title} - ${item.category}`,
              )}"
              target="_blank"
            >
              <i style="padding-right:4px" class="fa-brands fa-whatsapp"></i>
              Whatsapp
            </a>
          </div>
        </article>
      `,
          )
          .join("");
      }

      // INITIAL LOAD
      loadCollections();

      // CATEGORY TABS
      const tabButtons = document.querySelectorAll(".tab-btn");

      tabButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          tabButtons.forEach((tab) => tab.classList.remove("active"));

          btn.classList.add("active");

          activeCategory = btn.dataset.category;

          renderCollections();
        });
      });

      // GENDER FILTER
      const genderFilter = document.getElementById("gender-filter");

      if (genderFilter) {
        genderFilter.addEventListener("change", (event) => {
          activeGender = event.target.value;

          renderCollections();
        });
      }

      // FILTER FAB
      const filterFab = document.getElementById("filter-fab");

      if (filterFab) {
        filterFab.addEventListener("click", () => {
          if (genderFilter) {
            genderFilter.focus();
            genderFilter.click();
          }
        });
      }

      // IMAGE MODAL
      document.addEventListener("click", (e) => {
        const existingModal = document.getElementById("img-modal");

        // Close modal when clicking anywhere
        if (existingModal) {
          existingModal.remove();
          return;
        }

        // Open modal only for collection images
        if (
          e.target.tagName === "IMG" &&
          e.target.closest(".collection-media")
        ) {
          const modal = document.createElement("div");

          modal.id = "img-modal";

          modal.style.cssText = `
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.9);
        display:flex;
        justify-content:center;
        align-items:center;
        z-index:9999;
        cursor:pointer;
      `;

          modal.innerHTML = `
        <img
          src="${e.target.src}"
          style="max-width:95%;max-height:95%;object-fit:contain;"
        >
      `;

          document.body.appendChild(modal);
        }
      });
    </script>
